<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今晚别偷粮 - 原型 Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>今晚别偷粮</h1>
        <p>分路塔防 × 三合一升星</p>
      </div>
      <div class="stats" aria-label="游戏状态">
        <span>🪙 <strong id="gold">0</strong></span>
        <span>🌾 <strong id="lives">0</strong></span>
        <span>波次 <strong id="wave">0/8</strong></span>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="960" height="510" aria-label="三路塔防棋盘"></canvas>
      <div id="banner" class="banner" hidden></div>
    </section>

    <section class="control-strip" aria-label="主要操作">
      <div class="next-wave">
        <span class="label">下一波</span>
        <strong id="preview">普通鼠 × 4</strong>
      </div>
      <div class="actions">
        <button id="sell" class="button button-subtle" disabled>出售所选</button>
        <button id="merge" class="button button-merge" disabled>暂无可合成</button>
        <button id="start" class="button button-primary">开始第 1 波</button>
      </div>
    </section>

    <section class="lower-panel">
      <div class="bench-panel">
        <div class="section-heading">
          <div>
            <h2>备战区</h2>
            <p>点击单位，再点击棋盘空格进行部署</p>
          </div>
        </div>
        <div id="bench" class="bench" aria-label="备战区"></div>
      </div>

      <div class="shop-panel">
        <div class="section-heading shop-heading">
          <div>
            <h2>粮仓小铺</h2>
            <p>集齐三个同名同星单位即可合成</p>
          </div>
          <button id="reroll" class="button button-subtle">刷新 🪙1</button>
        </div>
        <div id="shop" class="shop" aria-label="单位商店"></div>
      </div>
    </section>

    <footer class="helpbar">
      <span><b>部署：</b>点击单位 → 点击空格</span>
      <span><b>移动：</b>点击棋盘单位 → 点击另一空格</span>
      <span><b>合成：</b>点击合成按钮 → 选择保留位置</span>
      <button id="reset" class="text-button">重新开始</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
