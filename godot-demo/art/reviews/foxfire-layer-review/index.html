<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>狐火小妖分层审核</title>
<style>
body{margin:24px;background:#17202a;color:#edf1f5;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto}h1{font-size:24px}p{color:#c8d1d9;line-height:1.6}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0}button,select,input{font:inherit}button,select{padding:7px 12px}canvas{display:block;width:100%;height:auto;background:#202a32}output{display:block;min-height:26px;margin:10px 0;font-variant-numeric:tabular-nums}small{color:#c8d1d9}#error{color:#ffbd8a}
</style><main>
<h1>狐火小妖 · 五状态分层审核</h1>
<p>独立素材预览，按样板建议节奏播放。十字为 (128,218) 脚底锚点；右侧为 3 倍细节。左侧棋盘为同尺寸示意。此页不代表正式战斗已接入。</p>
<p>审核结论：分层功能可验证，美术验收待修复。深底下可见蓄力、发射、受击帧衣尾缝隙亮色残块及受击脚下地面笔触。</p>
<nav>
<label>动作 <select id="action"><option value="idle">待机</option><option value="move">移动</option><option value="attack">普通攻击</option><option value="hit">受击</option><option value="retreat">退场</option><option value="all">五状态顺序播放</option></select></label>
<label><input id="vfx" type="checkbox" checked>显示独立特效</label>
<label>底色 <select id="background"><option value="board">棋盘</option><option value="dark">深色</option><option value="light">浅色</option><option value="check">透明格</option></select></label>
<label>速度 <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label>
<button id="play">暂停</button><button id="restart">重播</button>
</nav>
<canvas id="stage" width="1120" height="480" role="img" aria-label="左侧实际棋盘尺寸角色及投射物，右侧三倍放大，支持五状态播放和特效开关"></canvas>
<output id="status">正在载入素材…</output>
<label>进度 <input id="seek" type="range" min="0" max="1000" value="0" style="width:70%"></label>
<p id="note"></p><small id="checks"></small><p id="error"></p>
<script>
(async function(){
const $=id=>document.getElementById(id), ctx=$('stage').getContext('2d');
const load=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=()=>reject(Error('无法载入 '+src));im.src=src});
const base='../../production/foxfire_imp/demo_v1/';
try {
const [body,fx,projectile]=await Promise.all(['foxfire_imp_demo_body_atlas_v1.png','foxfire_imp_demo_vfx_atlas_v1.png','foxfire_imp_basic_projectile_v1.png'].map(f=>load(base+f)));
const cycle={idle:.8,move:.8,attack:.8,hit:.8,retreat:1.05,all:4.25};
let t=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();
const frameLabels=['待机','移动','普攻蓄力','普攻发射','受击','退场'];
function state(mode,time){
 if(mode==='all'){for(const m of ['idle','move','attack','hit','retreat']){if(time<cycle[m])return state(m,time);time-=cycle[m]}return state('idle',0)}
 const s={mode,time,frame:0,fx:-1,x:0,y:0,alpha:1,projectile:null};
 if(mode==='idle')s.fx=0;
 if(mode==='move'){s.frame=1;s.x=time/.8*120;s.y=Math.sin(time/.4*Math.PI*2)*2}
 if(mode==='attack'){s.frame=time<.12?2:time<.24?3:0;if(time>=.24)s.fx=0;if(time>=.12&&time<.32){const u=(time-.12)/.20;s.projectile={x:190+u*180,y:154}}}
 if(mode==='hit'){s.frame=time<.18?4:0;if(time>=.18)s.fx=0}
 if(mode==='retreat'){s.frame=5;s.fx=5;s.alpha=time<.45?1:Math.max(0,1-(time-.45)/.25)}
 return s;
}
function backdrop(x,y,w,h){
 const type=$('background').value;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 if(type==='board'){ctx.fillStyle='#d3b987';ctx.fillRect(x,y,w,h);for(let a=x;a<x+w;a+=162)for(let b=y;b<y+h;b+=113){ctx.strokeStyle='#a78b60';ctx.lineWidth=2;ctx.strokeRect(a,b,162,113)}}
 else if(type==='check'){for(let a=x;a<x+w;a+=16)for(let b=y;b<y+h;b+=16){ctx.fillStyle=((a-x)/16+(b-y)/16)%2?'#aeb8c1':'#d6dce2';ctx.fillRect(a,b,16,16)}}
 else {ctx.fillStyle=type==='dark'?'#17232d':'#eee8d9';ctx.fillRect(x,y,w,h)}
 ctx.restore();
}
function drawActor(s,x,y,scale){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.translate(-128,-218);ctx.globalAlpha=s.alpha;
 ctx.drawImage(body,s.frame*256,0,256,256,0,0,256,256);
 if($('vfx').checked&&s.fx>=0)ctx.drawImage(fx,s.fx*256,0,256,256,0,s.fx===0?Math.sin(s.time/.8*Math.PI*2)*1.5:0,256,256);
 if($('vfx').checked&&s.projectile)ctx.drawImage(projectile,s.projectile.x-32,s.projectile.y-32);
 ctx.restore();
 ctx.save();ctx.strokeStyle='#35abb5';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.moveTo(x,y-7);ctx.lineTo(x,y+7);ctx.stroke();ctx.restore();
}
function render(){
 const s=state($('action').value,t);ctx.clearRect(0,0,1120,480);backdrop(0,0,620,480);backdrop(630,0,490,480);
 // Actual asset scale equals 1.0 in the 1920×1080 game coordinate system.
 drawActor(s,185+s.x,305+s.y,1);drawActor(s,855,427,3);
 ctx.fillStyle=$('background').value==='dark'?'#eef2f5':'#26333b';ctx.font='16px system-ui';ctx.fillText('棋盘逻辑尺寸 1× · 格子 162×113',18,29);ctx.fillText('细节 3×',650,29);
 $('status').textContent=`${frameLabels[s.frame]} ｜ 动作时间 ${s.time.toFixed(3)} 秒 ｜ 独立特效 ${$('vfx').checked?'开':'关'} ｜ 飞行投射物 ${s.projectile&&$('vfx').checked?'1':'0'} ｜ 身体透明度 ${s.alpha.toFixed(2)}`;
 $('seek').value=Math.round(t/cycle[$('action').value]*1000);
 $('play').textContent=paused?'播放':'暂停';
 $('note').textContent=s.mode==='attack'?'蓄力 0.12 秒，发射姿势 0.12 秒，投射物飞行 0.20 秒。发射时关闭同帧飞弹层，避免与独立投射物重复。发射点为本审核页试验值 (190,154)，原清单没有配置发射点。':s.mode==='move'?'移动使用单张姿势与 2 像素起伏；位移仅用于验证锚点，不是行走逐帧动画。':s.mode==='retreat'?'退场保持 0.45 秒，随后身体与残火在 0.25 秒内共同淡出。':'关闭独立特效后检查身体轮廓；蓄力帧手部的小火焰仍包含在身体图中。';
}
// Exercise the specified schedule and the no-duplicate-projectile rule.
const assertions=[body.width===1536&&body.height===256,fx.width===1536&&fx.height===256,projectile.width===64&&projectile.height===64,state('attack',.119).frame===2,state('attack',.12).frame===3,state('attack',.12).fx===-1,!!state('attack',.12).projectile,!state('attack',.32).projectile,state('hit',.179).frame===4,state('hit',.18).frame===0,state('retreat',.45).alpha===1,state('retreat',.70).alpha<1e-6];
$('checks').textContent=`预览检查：${assertions.filter(Boolean).length}/${assertions.length} 通过；原始 PNG 审核结果另见 audit-results.json。`;
if(assertions.some(a=>!a))throw Error('预览节奏断言失败');
for(const id of ['action','background','vfx','speed'])$(id).addEventListener('change',()=>{if(id==='action')t=0;render()});
$('play').onclick=()=>{paused=!paused;render()};$('restart').onclick=()=>{t=0;render()};
$('seek').oninput=()=>{paused=true;t=Number($('seek').value)/1000*cycle[$('action').value];render()};
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)t=(t+dt*Number($('speed').value))%cycle[$('action').value];render();requestAnimationFrame(tick)}
render();requestAnimationFrame(tick);
}catch(e){$('error').textContent=e.message;console.error(e)}
})();
</script></main></html>
